[project]
name = "https-smb-server"
version = "1.0.0"
description = "基于 FastAPI 的 HTTPS 文件服务器，通过 cloudflared 暴露为 HTTPS，提供类 SMB/云盘的文件管理功能"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH", "PTH", "PL", "RUF", "S",
]
ignore = [
    "S101",     # assert in tests
    "PLR0913",  # FastAPI route handlers may have many params
    "PLR2004",  # magic values in config defaults
    "S104",     # binding to all interfaces (intentional for cloudflared)
    "S603",     # subprocess intentional
    "S607",     # partial paths
]

[tool.ruff.lint.isort]
known-first-party = ["core", "server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
