<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTPS SMB Server</title>
    <style>
        /* ============================================================
           全局样式
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-tertiary: #242836;
            --bg-hover: #2d3142;
            --text-primary: #e4e6eb;
            --text-secondary: #a0a3ab;
            --text-muted: #6b7080;
            --accent: #4f8cff;
            --accent-hover: #6da0ff;
            --danger: #ff4d6a;
            --danger-hover: #ff7088;
            --success: #34d399;
            --warning: #fbbf24;
            --border: #2d3142;
            --border-light: #3a3f52;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ============================================================
           顶部导航栏
           ============================================================ */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        .header-logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-logo svg { width: 24px; height: 24px; }
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .breadcrumb::-webkit-scrollbar { display: none; }
        .breadcrumb-item {
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.15s;
        }
        .breadcrumb-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .breadcrumb-item.current { color: var(--text-primary); font-weight: 600; cursor: default; }
        .breadcrumb-item.current:hover { background: transparent; }
        .breadcrumb-sep { color: var(--text-muted); font-size: 12px; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .storage-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .storage-bar-bar {
            width: 100px;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
        }
        .storage-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* ============================================================
           工具栏
           ============================================================ */
        .toolbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0 12px;
            flex: 1;
            max-width: 400px;
            transition: border-color 0.15s;
        }
        .search-box:focus-within { border-color: var(--accent); }
        .search-box svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
        .search-box input {
            border: none;
            background: transparent;
            color: var(--text-primary);
            padding: 8px;
            font-size: 13px;
            width: 100%;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .sort-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        .sort-select:focus { border-color: var(--accent); }
        .view-toggle {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .view-btn {
            padding: 6px 10px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s;
            display: flex;
            align-items: center;
        }
        .view-btn:hover { color: var(--text-primary); }
        .view-btn.active { background: var(--accent); color: white; }
        .view-btn svg { width: 16px; height: 16px; }
        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
        }

        /* ============================================================
           按钮通用
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
        .btn svg { width: 16px; height: 16px; }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-danger { color: var(--danger); }
        .btn-danger:hover { background: rgba(255,77,106,0.1); border-color: var(--danger); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ============================================================
           文件列表
           ============================================================ */
        .file-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        .file-list-container::-webkit-scrollbar { width: 6px; }
        .file-list-container::-webkit-scrollbar-track { background: transparent; }
        .file-list-container::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

        /* 列表视图 */
        .file-list-header {
            display: grid;
            grid-template-columns: 40px 1fr 120px 160px 80px;
            padding: 8px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            z-index: 5;
        }
        .file-list-header span { cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .file-list-header span:hover { color: var(--text-primary); }
        .file-list-header .sort-arrow { font-size: 10px; }
        .file-row {
            display: grid;
            grid-template-columns: 40px 1fr 120px 160px 80px;
            padding: 6px 24px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
            font-size: 13px;
        }
        .file-row:hover { background: var(--bg-hover); }
        .file-row.selected { background: rgba(79,140,255,0.1); }
        .file-row.drag-over { background: rgba(79,140,255,0.2); }
        .file-check {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-light);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .file-check.checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .file-check.checked::after { content: '\2713'; color: white; font-size: 11px; font-weight: 700; }
        .file-name {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .file-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }
        .file-icon.folder { background: rgba(251,191,36,0.15); color: var(--warning); }
        .file-icon.file { background: rgba(79,140,255,0.1); color: var(--accent); }
        .file-icon.file.pdf { background: rgba(255,77,106,0.1); color: var(--danger); }
        .file-icon.file.image { background: rgba(52,211,153,0.1); color: var(--success); }
        .file-icon.file.archive { background: rgba(168,85,247,0.1); color: #a855f7; }
        .file-icon.file.video { background: rgba(236,72,153,0.1); color: #ec4899; }
        .file-icon.file.audio { background: rgba(245,158,11,0.1); color: #f59e0b; }
        .file-icon.file.code { background: rgba(34,197,94,0.1); color: #22c55e; }
        .file-icon svg { width: 20px; height: 20px; }
        .file-name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-size, .file-modified { color: var(--text-secondary); font-size: 12px; }
        .file-actions-cell { display: flex; gap: 4px; justify-content: flex-end; }
        .icon-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .icon-btn.danger:hover { color: var(--danger); background: rgba(255,77,106,0.1); }
        .icon-btn svg { width: 16px; height: 16px; }

        /* 网格视图 */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            padding: 16px 24px;
            gap: 12px;
        }
        .file-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            position: relative;
        }
        .file-card:hover { border-color: var(--border-light); transform: translateY(-1px); box-shadow: var(--shadow); }
        .file-card.selected { border-color: var(--accent); background: rgba(79,140,255,0.05); }
        .file-card .file-icon { width: 48px; height: 48px; margin: 0 auto 10px; font-size: 22px; border-radius: 12px; }
        .file-card .file-icon svg { width: 28px; height: 28px; }
        .file-card-name {
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }
        .file-card-size { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .file-card .card-check {
            position: absolute;
            top: 8px;
            left: 8px;
        }
        .file-card .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: none;
        }
        .file-card:hover .card-actions { display: flex; gap: 2px; }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.3; }
        .empty-state p { font-size: 14px; }

        /* ============================================================
           上传进度
           ============================================================ */
        .upload-panel {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            max-height: 200px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .upload-panel-header {
            padding: 8px 24px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .upload-item {
            padding: 6px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }
        .upload-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .upload-progress-bar {
            width: 120px;
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
        }
        .upload-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s;
        }
        .upload-progress-fill.error { background: var(--danger); }
        .upload-progress-fill.done { background: var(--success); }
        .upload-percent { color: var(--text-secondary); width: 40px; text-align: right; }

        /* ============================================================
           模态框
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            min-width: 400px;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: transform 0.2s;
        }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .modal-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        .modal-input:focus { border-color: var(--accent); }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }
        .modal-error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 8px;
        }

        /* 右键菜单 */
        .context-menu {
            position: fixed;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 999;
            min-width: 180px;
            padding: 4px;
            display: none;
        }
        .context-menu.active { display: block; }
        .context-menu-item {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            transition: background 0.1s;
        }
        .context-menu-item:hover { background: var(--bg-hover); }
        .context-menu-item.danger { color: var(--danger); }
        .context-menu-item.danger:hover { background: rgba(255,77,106,0.1); }
        .context-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
        .context-menu-item svg { width: 16px; height: 16px; }
        .context-menu-item:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Toast 通知 */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            box-shadow: var(--shadow);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toast-in 0.3s ease;
            max-width: 360px;
        }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--accent); }
        @keyframes toast-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 拖拽上传覆盖层 */
        .drop-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(79,140,255,0.1);
            border: 3px dashed var(--accent);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent);
            font-weight: 600;
        }
        .drop-overlay.active { display: flex; }

        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 隐藏文件输入 */
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <!-- ============================================================
         顶部导航栏
         ============================================================ -->
    <header class="header">
        <div class="header-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            </svg>
            HTTPS SMB
        </div>
        <nav class="breadcrumb" id="breadcrumb"></nav>
        <div class="header-actions">
            <div class="storage-bar">
                <div class="storage-bar-bar">
                    <div class="storage-bar-fill" id="storageFill" style="width:0%"></div>
                </div>
                <span id="storageText">--</span>
            </div>
        </div>
    </header>

    <!-- ============================================================
         工具栏
         ============================================================ -->
    <div class="toolbar">
        <button class="btn btn-primary" onclick="triggerUpload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            上传
        </button>
        <button class="btn" onclick="showNewFolderModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            新建文件夹
        </button>
        <div class="toolbar-divider"></div>
        <button class="btn btn-danger" id="batchDeleteBtn" style="display:none" onclick="batchDelete()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            删除选中
        </button>
        <div style="flex:1"></div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="搜索文件..." onkeydown="if(event.key==='Enter')doSearch()">
        </div>
        <select class="sort-select" id="sortSelect" onchange="loadFiles()">
            <option value="name">名称排序</option>
            <option value="size">大小排序</option>
            <option value="modified">时间排序</option>
        </select>
        <div class="view-toggle">
            <div class="view-btn active" id="listViewBtn" onclick="setView('list')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </div>
            <div class="view-btn" id="gridViewBtn" onclick="setView('grid')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            </div>
        </div>
    </div>

    <!-- ============================================================
         文件内容区
         ============================================================ -->
    <div class="file-list-container" id="fileContainer">
        <div class="loading" id="loadingIndicator"><div class="spinner"></div></div>
    </div>

    <!-- ============================================================
         上传进度面板
         ============================================================ -->
    <div class="upload-panel" id="uploadPanel" style="display:none">
        <div class="upload-panel-header">
            <span>上传任务</span>
            <button class="icon-btn" onclick="clearCompletedUploads()" title="清除已完成">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div id="uploadList"></div>
    </div>

    <!-- ============================================================
         右键菜单
         ============================================================ -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="contextAction('open')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/></svg>
            打开
        </div>
        <div class="context-menu-item" onclick="contextAction('download')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" onclick="contextAction('rename')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            重命名
        </div>
        <div class="context-menu-item" onclick="contextAction('copy')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            复制到...
        </div>
        <div class="context-menu-item" onclick="contextAction('move')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            移动到...
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item danger" onclick="contextAction('delete')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            删除
        </div>
    </div>

    <!-- ============================================================
         模态框
         ============================================================ -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-title" id="modalTitle">新建文件夹</div>
            <input class="modal-input" id="modalInput" placeholder="请输入名称" onkeydown="if(event.key==='Enter')confirmModal()">
            <div class="modal-error" id="modalError"></div>
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" id="modalConfirm" onclick="confirmModal()">确定</button>
            </div>
        </div>
    </div>

    <!-- 拖拽上传覆盖层 -->
    <div class="drop-overlay" id="dropOverlay">释放文件以上传</div>

    <!-- Toast 通知容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" class="hidden-input" id="fileInput" multiple onchange="handleFileSelect(this.files)">

    <script>
    /* ==============================================================
       全局状态
       ============================================================== */
    let currentPath = '';        // 当前目录路径
    let currentFiles = [];       // 当前目录文件列表
    let selectedFiles = new Set(); // 选中的文件路径集合
    let viewMode = 'list';       // 视图模式: list / grid
    let contextTarget = null;    // 右键菜单目标
    let modalCallback = null;    // 模态框回调
    let activeUploads = {};      // 活跃的上传任务
    const CHUNK_SIZE = 8 * 1024 * 1024; // 8MB 分块大小，需与后端一致

    /* ==============================================================
       初始化
       ============================================================== */
    document.addEventListener('DOMContentLoaded', () => {
        loadFiles();
        loadStorageInfo();
        setupDragDrop();
        setupKeyboard();
        // 点击空白关闭右键菜单
        document.addEventListener('click', () => hideContextMenu());
        // 禁用默认右键菜单
        document.getElementById('fileContainer').addEventListener('contextmenu', e => e.preventDefault());
    });

    /* ==============================================================
       API 工具函数
       ============================================================== */
    async function api(path, options = {}) {
        const resp = await fetch(path, options);
        const data = await resp.json();
        if (!resp.ok) {
            throw new Error(data.detail || `请求失败 (${resp.status})`);
        }
        return data;
    }

    /* ==============================================================
       文件列表加载
       ============================================================== */
    async function loadFiles() {
        const container = document.getElementById('fileContainer');
        const loading = document.getElementById('loadingIndicator');
        container.innerHTML = '';
        container.appendChild(loading);
        loading.style.display = 'flex';

        try {
            const sortBy = document.getElementById('sortSelect').value;
            const resp = await api(`/api/files?path=${encodeURIComponent(currentPath)}&sort_by=${sortBy}&sort_order=asc`);
            currentFiles = resp.data;
            selectedFiles.clear();
            updateBatchDeleteBtn();
            renderBreadcrumb();
            renderFiles();
        } catch (e) {
            container.innerHTML = `<div class="empty-state"><p>加载失败: ${e.message}</p></div>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    /* ==============================================================
       渲染面包屑导航
       ============================================================== */
    function renderBreadcrumb() {
        const bc = document.getElementById('breadcrumb');
        const parts = currentPath ? currentPath.split('/').filter(Boolean) : [];
        let html = `<div class="breadcrumb-item ${parts.length === 0 ? 'current' : ''}" onclick="navigateTo('')">
            <svg style="width:14px;height:14px;vertical-align:-2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            根目录</div>`;
        let pathAccum = '';
        parts.forEach((part, i) => {
            pathAccum += (pathAccum ? '/' : '') + part;
            const isCurrent = i === parts.length - 1;
            html += `<span class="breadcrumb-sep">/</span>`;
            html += `<div class="breadcrumb-item ${isCurrent ? 'current' : ''}" onclick="navigateTo('${escapeHtml(pathAccum)}')">${escapeHtml(part)}</div>`;
        });
        bc.innerHTML = html;
    }

    /* ==============================================================
       渲染文件列表/网格
       ============================================================== */
    function renderFiles() {
        const container = document.getElementById('fileContainer');
        if (currentFiles.length === 0) {
            container.innerHTML = `<div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                <p>此目录为空，拖拽文件到此处或点击上传按钮</p></div>`;
            return;
        }
        if (viewMode === 'list') {
            renderListView(container);
        } else {
            renderGridView(container);
        }
    }

    function renderListView(container) {
        let html = `<div class="file-list-header">
            <span><div class="file-check ${isAllSelected() ? 'checked' : ''}" onclick="toggleSelectAll()"></div></span>
            <span>名称</span>
            <span>大小</span>
            <span>修改时间</span>
            <span>操作</span>
        </div>`;
        currentFiles.forEach(f => {
            const sel = selectedFiles.has(f.path);
            html += `<div class="file-row ${sel ? 'selected' : ''}"
                data-path="${escapeHtml(f.path)}"
                onclick="handleFileClick(event, '${escapeJs(f.path)}', ${f.is_dir})"
                ondblclick="handleFileDblClick('${escapeJs(f.path)}', ${f.is_dir})"
                oncontextmenu="showContextMenu(event, '${escapeJs(f.path)}', ${f.is_dir})"
                ondragover="event.preventDefault();this.classList.add('drag-over')"
                ondragleave="this.classList.remove('drag-over')"
                ondrop="handleDropOnFolder(event, '${escapeJs(f.path)}')">
                <div class="file-check ${sel ? 'checked' : ''}" onclick="event.stopPropagation();toggleSelect('${escapeJs(f.path)}')"></div>
                <div class="file-name">
                    <div class="file-icon ${f.is_dir ? 'folder' : getFileTypeClass(f.extension)}">
                        ${f.is_dir ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>' : getFileIcon(f.extension)}
                    </div>
                    <span class="file-name-text" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
                </div>
                <span class="file-size">${f.is_dir ? '--' : formatSize(f.size)}</span>
                <span class="file-modified">${formatTime(f.modified)}</span>
                <div class="file-actions-cell">
                    ${!f.is_dir ? `<button class="icon-btn" onclick="event.stopPropagation();downloadFile('${escapeJs(f.path)}')" title="下载"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>` : ''}
                    <button class="icon-btn danger" onclick="event.stopPropagation();deleteFile('${escapeJs(f.path)}', ${f.is_dir})" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    function renderGridView(container) {
        let html = '<div class="file-grid">';
        currentFiles.forEach(f => {
            const sel = selectedFiles.has(f.path);
            html += `<div class="file-card ${sel ? 'selected' : ''}"
                data-path="${escapeHtml(f.path)}"
                onclick="handleFileClick(event, '${escapeJs(f.path)}', ${f.is_dir})"
                ondblclick="handleFileDblClick('${escapeJs(f.path)}', ${f.is_dir})"
                oncontextmenu="showContextMenu(event, '${escapeJs(f.path)}', ${f.is_dir})">
                <div class="card-check file-check ${sel ? 'checked' : ''}" onclick="event.stopPropagation();toggleSelect('${escapeJs(f.path)}')"></div>
                <div class="card-actions">
                    <button class="icon-btn danger" onclick="event.stopPropagation();deleteFile('${escapeJs(f.path)}', ${f.is_dir})" title="删除">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                    </button>
                </div>
                <div class="file-icon ${f.is_dir ? 'folder' : getFileTypeClass(f.extension)}">
                    ${f.is_dir ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>' : getFileIcon(f.extension)}
                </div>
                <div class="file-card-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
                <div class="file-card-size">${f.is_dir ? '文件夹' : formatSize(f.size)}</div>
            </div>`;
        });
        html += '</div>';
        container.innerHTML = html;
    }

    /* ==============================================================
       导航
       ============================================================== */
    function navigateTo(path) {
        currentPath = path;
        loadFiles();
    }

    function handleFileDblClick(path, isDir) {
        if (isDir) {
            navigateTo(path);
        } else {
            downloadFile(path);
        }
    }

    function handleFileClick(event, path, isDir) {
        if (event.ctrlKey || event.metaKey) {
            toggleSelect(path);
        } else if (!event.shiftKey) {
            selectedFiles.clear();
            selectedFiles.add(path);
            updateBatchDeleteBtn();
            renderFiles();
        }
    }

    /* ==============================================================
       选择操作
       ============================================================== */
    function toggleSelect(path) {
        if (selectedFiles.has(path)) {
            selectedFiles.delete(path);
        } else {
            selectedFiles.add(path);
        }
        updateBatchDeleteBtn();
        renderFiles();
    }

    function toggleSelectAll() {
        if (isAllSelected()) {
            selectedFiles.clear();
        } else {
            currentFiles.forEach(f => selectedFiles.add(f.path));
        }
        updateBatchDeleteBtn();
        renderFiles();
    }

    function isAllSelected() {
        return currentFiles.length > 0 && currentFiles.every(f => selectedFiles.has(f.path));
    }

    function updateBatchDeleteBtn() {
        const btn = document.getElementById('batchDeleteBtn');
        btn.style.display = selectedFiles.size > 0 ? 'inline-flex' : 'none';
        btn.textContent = `删除选中 (${selectedFiles.size})`;
    }

    /* ==============================================================
       视图切换
       ============================================================== */
    function setView(mode) {
        viewMode = mode;
        document.getElementById('listViewBtn').classList.toggle('active', mode === 'list');
        document.getElementById('gridViewBtn').classList.toggle('active', mode === 'grid');
        renderFiles();
    }

    /* ==============================================================
       新建文件夹
       ============================================================== */
    function showNewFolderModal() {
        showModal('新建文件夹', '请输入文件夹名称', '', async (name) => {
            await api('/api/files/mkdir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: currentPath, name }),
            });
            toast('文件夹创建成功', 'success');
            loadFiles();
        });
    }

    /* ==============================================================
       文件操作
       ============================================================== */
    async function deleteFile(path, isDir) {
        const name = path.split('/').pop();
        if (!confirm(`确定删除 "${name}" 吗？${isDir ? '将递归删除所有内容。' : ''}`)) return;
        try {
            await api('/api/files/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path, recursive: isDir }),
            });
            toast('删除成功', 'success');
            loadFiles();
        } catch (e) {
            toast(`删除失败: ${e.message}`, 'error');
        }
    }

    async function batchDelete() {
        const paths = [...selectedFiles];
        if (!confirm(`确定删除选中的 ${paths.length} 项吗？`)) return;
        try {
            const resp = await api('/api/files/batch-delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paths, recursive: true }),
            });
            if (resp.data.errors.length > 0) {
                toast(`部分删除失败: ${resp.data.errors.map(e => e.error).join(', ')}`, 'error');
            } else {
                toast(`已删除 ${paths.length} 项`, 'success');
            }
            loadFiles();
        } catch (e) {
            toast(`批量删除失败: ${e.message}`, 'error');
        }
    }

    async function renameFile(path, isDir) {
        const oldName = path.split('/').pop();
        showModal('重命名', '请输入新名称', oldName, async (newName) => {
            if (newName === oldName) return;
            await api('/api/files/rename', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path, new_name: newName }),
            });
            toast('重命名成功', 'success');
            loadFiles();
        });
    }

    /* ==============================================================
       下载
       ============================================================== */
    function downloadFile(path) {
        window.open(`/api/download/file?path=${encodeURIComponent(path)}`, '_blank');
    }

    async function downloadSelected() {
        const paths = [...selectedFiles].filter(p => {
            const f = currentFiles.find(x => x.path === p);
            return f && !f.is_dir;
        });
        if (paths.length === 0) { toast('没有可下载的文件', 'info'); return; }
        if (paths.length === 1) {
            downloadFile(paths[0]);
        } else {
            window.open(`/api/download/batch?paths=${paths.map(p => encodeURIComponent(p)).join(',')}`, '_blank');
        }
    }

    /* ==============================================================
       搜索
       ============================================================== */
    async function doSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if (!q) { loadFiles(); return; }
        try {
            const resp = await api(`/api/files/search?q=${encodeURIComponent(q)}&path=${encodeURIComponent(currentPath)}`);
            currentFiles = resp.data;
            selectedFiles.clear();
            updateBatchDeleteBtn();
            const container = document.getElementById('fileContainer');
            if (currentFiles.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>未找到匹配 "${escapeHtml(q)}" 的文件</p></div>`;
            } else {
                renderFiles();
            }
        } catch (e) {
            toast(`搜索失败: ${e.message}`, 'error');
        }
    }

    /* ==============================================================
       右键菜单
       ============================================================== */
    function showContextMenu(event, path, isDir) {
        event.preventDefault();
        event.stopPropagation();
        contextTarget = { path, isDir };
        const menu = document.getElementById('contextMenu');
        menu.classList.add('active');
        // 定位
        let x = event.clientX, y = event.clientY;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        // 防止溢出
        requestAnimationFrame(() => {
            const rect = menu.getBoundingClientRect();
            if (rect.right > window.innerWidth) menu.style.left = (x - rect.width) + 'px';
            if (rect.bottom > window.innerHeight) menu.style.top = (y - rect.height) + 'px';
        });
    }

    function hideContextMenu() {
        document.getElementById('contextMenu').classList.remove('active');
    }

    function contextAction(action) {
        hideContextMenu();
        if (!contextTarget) return;
        const { path, isDir } = contextTarget;
        switch (action) {
            case 'open':
                if (isDir) navigateTo(path);
                else downloadFile(path);
                break;
            case 'download':
                if (!isDir) downloadFile(path);
                break;
            case 'rename':
                renameFile(path, isDir);
                break;
            case 'copy':
                toast('复制功能：请选择目标文件夹后粘贴', 'info');
                break;
            case 'move':
                toast('移动功能：请选择目标文件夹', 'info');
                break;
            case 'delete':
                deleteFile(path, isDir);
                break;
        }
    }

    /* ==============================================================
       上传功能
       ============================================================== */
    function triggerUpload() {
        document.getElementById('fileInput').click();
    }

    async function handleFileSelect(fileList) {
        for (const file of fileList) {
            uploadFile(file);
        }
        document.getElementById('fileInput').value = '';
    }

    async function uploadFile(file) {
        const uploadId = `upload_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
        const panel = document.getElementById('uploadPanel');
        const list = document.getElementById('uploadList');
        panel.style.display = 'block';

        // 创建进度条UI
        const item = document.createElement('div');
        item.className = 'upload-item';
        item.id = `upload_${uploadId}`;
        item.innerHTML = `
            <span class="upload-item-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span>
            <div class="upload-progress-bar"><div class="upload-progress-fill" id="progress_${uploadId}" style="width:0%"></div></div>
            <span class="upload-percent" id="percent_${uploadId}">0%</span>
        `;
        list.appendChild(item);

        const updateProgress = (pct, error = false, done = false) => {
            const fill = document.getElementById(`progress_${uploadId}`);
            const pctEl = document.getElementById(`percent_${uploadId}`);
            if (fill) {
                fill.style.width = pct + '%';
                fill.className = 'upload-progress-fill' + (error ? ' error' : done ? ' done' : '');
            }
            if (pctEl) pctEl.textContent = Math.round(pct) + '%';
        };

        try {
            if (file.size <= CHUNK_SIZE) {
                // 小文件：简单上传
                updateProgress(30);
                const formData = new FormData();
                formData.append('path', currentPath);
                formData.append('file', file);
                formData.append('overwrite', 'true');
                await fetch('/api/upload/simple', { method: 'POST', body: formData });
                updateProgress(100, false, true);
            } else {
                // 大文件：分块上传
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                updateProgress(0);

                // 计算文件MD5（用于秒传）
                updateProgress(1);
                const fileHash = await computeMD5(file);
                updateProgress(5);

                // 1. 初始化上传
                const initResp = await api('/api/upload/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: currentPath,
                        file_name: file.name,
                        file_size: file.size,
                        file_hash: fileHash,
                    }),
                });

                // 秒传成功
                if (initResp.data.status === 'instant') {
                    updateProgress(100, false, true);
                    toast(`秒传成功: ${file.name}`, 'success');
                    loadFiles();
                    return;
                }

                const uploadIdServer = initResp.data.upload_id;

                // 2. 逐块上传
                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    const chunk = file.slice(start, end);

                    const formData = new FormData();
                    formData.append('chunk', chunk);

                    await fetch(`/api/upload/chunk/${uploadIdServer}/${i}`, {
                        method: 'PUT',
                        body: formData,
                    });

                    const pct = 10 + (i + 1) / totalChunks * 85;
                    updateProgress(pct);
                }

                // 3. 完成上传
                await api('/api/upload/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ upload_id: uploadIdServer }),
                });
                updateProgress(100, false, true);
            }
            toast(`上传成功: ${file.name}`, 'success');
            loadFiles();
        } catch (e) {
            updateProgress(0, true);
            toast(`上传失败: ${file.name} - ${e.message}`, 'error');
        }
    }

    /**
     * 计算文件 MD5
     */
    function computeMD5(file) {
        return new Promise((resolve, reject) => {
            // 使用 Web Crypto API (如果可用)，否则用简单hash
            if (crypto.subtle) {
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const buffer = reader.result;
                        const hashBuffer = await crypto.subtle.digest('MD5', buffer);
                        // MD5 可能不被支持，回退到 SHA-256
                        const hashArray = Array.from(new Uint8Array(hashBuffer));
                        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                        resolve(hashHex);
                    } catch {
                        // MD5 不可用时返回空字符串（跳过秒传判断）
                        resolve('');
                    }
                };
                reader.onerror = () => resolve('');
                reader.readAsArrayBuffer(file);
            } else {
                resolve('');
            }
        });
    }

    function clearCompletedUploads() {
        document.querySelectorAll('.upload-progress-fill.done').forEach(el => {
            el.closest('.upload-item').remove();
        });
        const list = document.getElementById('uploadList');
        if (!list.children.length) document.getElementById('uploadPanel').style.display = 'none';
    }

    /* ==============================================================
       拖拽上传
       ============================================================== */
    function setupDragDrop() {
        let dragCounter = 0;
        const overlay = document.getElementById('dropOverlay');
        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            overlay.classList.add('active');
        });
        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter <= 0) { overlay.classList.remove('active'); dragCounter = 0; }
        });
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            overlay.classList.remove('active');
            if (e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files);
        });
    }

    function handleDropOnFolder(event, folderPath) {
        event.preventDefault();
        event.currentTarget.classList.remove('drag-over');
        if (!event.dataTransfer.files.length) return;
        // 上传到指定文件夹
        const originalPath = currentPath;
        currentPath = folderPath;
        handleFileSelect(event.dataTransfer.files);
        currentPath = originalPath;
    }

    /* ==============================================================
       键盘快捷键
       ============================================================== */
    function setupKeyboard() {
        document.addEventListener('keydown', (e) => {
            // Delete 键删除
            if (e.key === 'Delete' && selectedFiles.size > 0) batchDelete();
            // Ctrl+A 全选
            if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                e.preventDefault();
                currentFiles.forEach(f => selectedFiles.add(f.path));
                updateBatchDeleteBtn();
                renderFiles();
            }
            // Backspace 返回上级
            if (e.key === 'Backspace' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                const parts = currentPath.split('/').filter(Boolean);
                parts.pop();
                navigateTo(parts.join('/'));
            }
            // F2 重命名
            if (e.key === 'F2' && selectedFiles.size === 1) {
                e.preventDefault();
                const path = [...selectedFiles][0];
                const f = currentFiles.find(x => x.path === path);
                if (f) renameFile(path, f.is_dir);
            }
            // Escape 取消选择
            if (e.key === 'Escape') {
                selectedFiles.clear();
                updateBatchDeleteBtn();
                renderFiles();
                hideContextMenu();
                closeModal();
            }
        });
    }

    /* ==============================================================
       存储信息
       ============================================================== */
    async function loadStorageInfo() {
        try {
            const resp = await api('/api/storage');
            const s = resp.data;
            const pct = (s.used / s.total * 100).toFixed(1);
            document.getElementById('storageFill').style.width = pct + '%';
            document.getElementById('storageText').textContent = `${formatSize(s.used)} / ${formatSize(s.total)}`;
        } catch (e) { /* 忽略 */ }
    }

    /* ==============================================================
       模态框
       ============================================================== */
    function showModal(title, placeholder, defaultValue, callback) {
        document.getElementById('modalTitle').textContent = title;
        const input = document.getElementById('modalInput');
        input.placeholder = placeholder;
        input.value = defaultValue || '';
        document.getElementById('modalError').textContent = '';
        modalCallback = callback;
        document.getElementById('modalOverlay').classList.add('active');
        setTimeout(() => { input.focus(); input.select(); }, 100);
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
        modalCallback = null;
    }

    async function confirmModal() {
        const value = document.getElementById('modalInput').value.trim();
        const errorEl = document.getElementById('modalError');
        if (!value) { errorEl.textContent = '名称不能为空'; return; }
        if (/[<>:"|?*\\]/.test(value)) { errorEl.textContent = '名称包含非法字符'; return; }
        try {
            if (modalCallback) await modalCallback(value);
            closeModal();
        } catch (e) {
            errorEl.textContent = e.message;
        }
    }

    /* ==============================================================
       Toast 通知
       ============================================================== */
    function toast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        const icons = {
            success: '\u2713',
            error: '\u2717',
            info: 'i',
        };
        t.innerHTML = `<strong>${icons[type] || ''}</strong> ${escapeHtml(message)}`;
        container.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; t.style.transition = 'all 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
    }

    /* ==============================================================
       工具函数
       ============================================================== */
    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
    }

    function formatTime(ts) {
        const d = new Date(ts * 1000);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function escapeJs(str) {
        return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function getFileTypeClass(ext) {
        const map = {
            '.pdf': 'pdf', '.jpg': 'image', '.jpeg': 'image', '.png': 'image', '.gif': 'image',
            '.webp': 'image', '.svg': 'image', '.bmp': 'image', '.ico': 'image',
            '.zip': 'archive', '.rar': 'archive', '.7z': 'archive', '.tar': 'archive', '.gz': 'archive',
            '.mp4': 'video', '.mkv': 'video', '.avi': 'video', '.mov': 'video', '.wmv': 'video',
            '.mp3': 'audio', '.flac': 'audio', '.wav': 'audio', '.aac': 'audio', '.ogg': 'audio',
            '.py': 'code', '.js': 'code', '.ts': 'code', '.html': 'code', '.css': 'code', '.json': 'code',
            '.md': 'code', '.yaml': 'code', '.yml': 'code', '.sh': 'code', '.bat': 'code',
        };
        return 'file ' + (map[ext] || '');
    }

    function getFileIcon(ext) {
        // 简化图标：使用 SVG 文件图标
        const icons = {
            '.pdf': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
            '.zip': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
            '.jpg': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
            '.mp4': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
            '.mp3': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
        };
        return icons[ext] || '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';
    }
    </script>
</body>
